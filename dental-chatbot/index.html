<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>치과 상담 AI</title>
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ──────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, #2b6cb0, #2c5282);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    header .logo { font-size: 28px; }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
    header p  { font-size: 12px; opacity: .8; margin-top: 2px; }

    /* ── Layout ──────────────────────────────────────────────────── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* ── Sidebar ─────────────────────────────────────────────────── */
    .sidebar {
      width: 280px;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
      gap: 20px;
      overflow-y: auto;
    }
    .sidebar-section h2 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .8px;
      color: #718096;
      margin-bottom: 10px;
    }

    /* 환자 유형 카드 */
    .patient-card {
      background: #ebf8ff;
      border: 1.5px solid #90cdf4;
      border-radius: 12px;
      padding: 14px;
      font-size: 13px;
    }
    .patient-card .type-badge {
      display: inline-block;
      background: #2b6cb0;
      color: #fff;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .patient-card .confidence-bar {
      height: 6px;
      background: #bee3f8;
      border-radius: 3px;
      margin: 6px 0;
    }
    .patient-card .confidence-fill {
      height: 100%;
      background: #2b6cb0;
      border-radius: 3px;
      transition: width .4s ease;
    }
    .patient-card .label { color: #4a5568; font-size: 12px; }
    .patient-card .value { font-weight: 600; color: #2d3748; }
    .tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
    .tag {
      background: #e2e8f0;
      color: #4a5568;
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 11px;
    }
    .tip-box {
      background: #fffbeb;
      border-left: 3px solid #f6ad55;
      border-radius: 0 8px 8px 0;
      padding: 8px 10px;
      font-size: 12px;
      color: #744210;
      margin-top: 8px;
    }

    /* 빠른 질문 버튼 */
    .quick-btn-list { display: flex; flex-direction: column; gap: 6px; }
    .quick-btn {
      background: #f7fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      color: #2d3748;
      cursor: pointer;
      text-align: left;
      transition: all .15s;
    }
    .quick-btn:hover {
      background: #ebf8ff;
      border-color: #90cdf4;
      color: #2b6cb0;
    }

    /* 예약 유도 버튼 */
    .appointment-btn {
      width: 100%;
      background: linear-gradient(135deg, #38a169, #276749);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
      letter-spacing: -.2px;
    }
    .appointment-btn:hover { opacity: .9; }

    /* ── Chat Area ───────────────────────────────────────────────── */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 말풍선 */
    .bubble-wrap {
      display: flex;
      gap: 10px;
      max-width: 75%;
    }
    .bubble-wrap.user  { align-self: flex-end; flex-direction: row-reverse; }
    .bubble-wrap.assistant { align-self: flex-start; }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .avatar.ai   { background: #ebf8ff; }
    .avatar.user { background: #e2e8f0; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .bubble-wrap.assistant .bubble {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-top-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .bubble-wrap.user .bubble {
      background: #2b6cb0;
      color: #fff;
      border-top-right-radius: 4px;
    }

    /* 입력 영역 */
    .input-area {
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-area textarea {
      flex: 1;
      border: 1.5px solid #cbd5e0;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      min-height: 46px;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color .15s;
      font-family: inherit;
    }
    .input-area textarea:focus {
      outline: none;
      border-color: #2b6cb0;
    }
    .send-btn {
      background: #2b6cb0;
      color: #fff;
      border: none;
      border-radius: 10px;
      width: 46px;
      height: 46px;
      font-size: 20px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
    }
    .send-btn:hover { background: #2c5282; }
    .send-btn:disabled { background: #a0aec0; cursor: not-allowed; }

    /* 툴바 (요약 버튼) */
    .toolbar {
      background: #f7fafc;
      border-top: 1px solid #e2e8f0;
      padding: 8px 20px;
      display: flex;
      gap: 8px;
    }
    .tool-btn {
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: #4a5568;
      cursor: pointer;
      transition: all .15s;
    }
    .tool-btn:hover {
      border-color: #90cdf4;
      color: #2b6cb0;
    }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      width: 480px;
      max-width: 90vw;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal h2 { font-size: 18px; margin-bottom: 16px; color: #2d3748; }
    .modal-close {
      float: right;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #718096;
      line-height: 1;
    }
    .summary-row {
      margin-bottom: 14px;
    }
    .summary-row .s-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #718096;
      letter-spacing: .6px;
      margin-bottom: 4px;
    }
    .summary-row .s-value {
      font-size: 14px;
      color: #2d3748;
      line-height: 1.5;
    }
    .readiness-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .readiness-high   { background: #c6f6d5; color: #276749; }
    .readiness-mid    { background: #fefcbf; color: #744210; }
    .readiness-low    { background: #fed7d7; color: #9b2c2c; }

    /* 로딩 */
    .typing-indicator {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 12px 16px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #a0aec0;
      border-radius: 50%;
      animation: bounce .9s infinite;
    }
    .dot:nth-child(2) { animation-delay: .15s; }
    .dot:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%           { transform: translateY(-6px); }
    }

    /* 반응형 */
    @media (max-width: 640px) {
      .sidebar { display: none; }
    }
  </style>
</head>
<body>

<header>
  <span class="logo">🦷</span>
  <div>
    <h1>치과 상담 AI</h1>
    <p>임플란트 · 충치 · 스케일링 · 잇몸 치료 전문 상담</p>
  </div>
</header>

<div class="layout">
  <!-- 사이드바 -->
  <aside class="sidebar">
    <!-- 환자 유형 분석 -->
    <div class="sidebar-section">
      <h2>환자 유형 분석</h2>
      <div class="patient-card" id="patient-card">
        <div style="color:#a0aec0;font-size:13px;">대화를 시작하면 환자 유형이 분석됩니다.</div>
      </div>
    </div>

    <!-- 빠른 질문 -->
    <div class="sidebar-section">
      <h2>빠른 질문</h2>
      <div class="quick-btn-list">
        <button class="quick-btn" onclick="sendQuick('임플란트 비용이 얼마나 드나요?')">
          🦷 임플란트 비용 문의
        </button>
        <button class="quick-btn" onclick="sendQuick('치아가 많이 아픈데 충치인가요?')">
          😣 치통 / 충치 상담
        </button>
        <button class="quick-btn" onclick="sendQuick('스케일링은 얼마나 자주 해야 하나요?')">
          ✨ 스케일링 주기 문의
        </button>
        <button class="quick-btn" onclick="sendQuick('치과 치료가 너무 무서운데 어떻게 하나요?')">
          😰 치과 공포증 상담
        </button>
        <button class="quick-btn" onclick="sendQuick('앞니가 부러졌는데 어떻게 치료하나요?')">
          💔 파절 / 손상 치아
        </button>
        <button class="quick-btn" onclick="sendQuick('잇몸에서 피가 자주 나는데 괜찮은가요?')">
          🩸 잇몸 출혈 상담
        </button>
      </div>
    </div>

    <!-- 예약 유도 -->
    <div class="sidebar-section">
      <button class="appointment-btn" onclick="sendQuick('진료 예약을 하고 싶어요. 어떻게 하면 되나요?')">
        📅 진료 예약 안내받기
      </button>
    </div>
  </aside>

  <!-- 채팅 영역 -->
  <div class="chat-area">
    <div class="messages" id="messages">
      <!-- 초기 인사 메시지 -->
      <div class="bubble-wrap assistant">
        <div class="avatar ai">🦷</div>
        <div class="bubble">
          안녕하세요! 저는 치과 상담 AI입니다. 😊<br><br>
          임플란트, 충치, 스케일링, 잇몸 치료 등 궁금하신 점을 편하게 말씀해 주세요.<br>
          전문 상담을 통해 최선의 방향을 안내해 드리겠습니다.
        </div>
      </div>
    </div>

    <!-- 툴바 -->
    <div class="toolbar">
      <button class="tool-btn" onclick="openSummary()">📋 상담 요약 보기</button>
      <button class="tool-btn" onclick="resetChat()">🔄 새 상담 시작</button>
    </div>

    <!-- 입력 영역 -->
    <div class="input-area">
      <textarea
        id="input"
        placeholder="치과 상담 내용을 입력하세요... (Shift+Enter: 줄바꿈)"
        rows="1"
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" title="전송">
        ➤
      </button>
    </div>
  </div>
</div>

<!-- 요약 모달 -->
<div class="modal-overlay" id="summary-modal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('summary-modal')">✕</button>
    <h2>📋 상담 요약</h2>
    <div id="summary-content"><p style="color:#a0aec0">요약 생성 중...</p></div>
  </div>
</div>

<script>
  // ── 상태 ──────────────────────────────────────────────────────────────────
  let messages = [];   // {role, content}
  let isLoading = false;

  // ── 메시지 전송 ───────────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('input');
    const text = input.value.trim();
    if (!text || isLoading) return;

    input.value = '';
    autoResize(input);

    addBubble('user', text);
    messages.push({ role: 'user', content: text });

    setLoading(true);
    const typingEl = addTypingIndicator();

    try {
      const resp = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });

      if (!resp.ok) throw new Error('서버 오류');

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';
      let bubbleEl = null;

      typingEl.remove();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const chunk = decoder.decode(value);
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') break;
          try {
            const parsed = JSON.parse(data);
            if (parsed.text) {
              fullText += parsed.text;
              if (!bubbleEl) {
                bubbleEl = addBubble('assistant', fullText);
              } else {
                bubbleEl.textContent = fullText;
              }
              scrollToBottom();
            }
          } catch {}
        }
      }

      if (fullText) messages.push({ role: 'assistant', content: fullText });

      // 3번째 교환 이후마다 환자 유형 분석
      if (messages.length >= 4 && messages.length % 4 === 0) {
        analyzePatient();
      }

    } catch (e) {
      typingEl?.remove();
      addBubble('assistant', '죄송합니다. 일시적인 오류가 발생했습니다. 다시 시도해 주세요.');
    } finally {
      setLoading(false);
    }
  }

  function sendQuick(text) {
    document.getElementById('input').value = text;
    sendMessage();
  }

  // ── UI 헬퍼 ──────────────────────────────────────────────────────────────
  function addBubble(role, text) {
    const wrap = document.createElement('div');
    wrap.className = `bubble-wrap ${role}`;

    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'assistant' ? 'ai' : 'user'}`;
    avatar.textContent = role === 'assistant' ? '🦷' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    document.getElementById('messages').appendChild(wrap);
    scrollToBottom();
    return bubble;
  }

  function addTypingIndicator() {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-wrap assistant';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = '🦷';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = `<div class="typing-indicator">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    document.getElementById('messages').appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function scrollToBottom() {
    const el = document.getElementById('messages');
    el.scrollTop = el.scrollHeight;
  }

  function setLoading(val) {
    isLoading = val;
    document.getElementById('send-btn').disabled = val;
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  // ── 환자 유형 분석 ────────────────────────────────────────────────────────
  async function analyzePatient() {
    try {
      const resp = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });
      const data = await resp.json();
      renderPatientCard(data);
    } catch {}
  }

  function renderPatientCard(data) {
    const card = document.getElementById('patient-card');
    const conf = Math.round((data.confidence || 0) * 100);
    const readinessColor = {
      '높음': '#38a169', '중간': '#dd6b20', '낮음': '#e53e3e'
    }[data.appointment_readiness] || '#718096';

    const concerns = (data.concerns || []).map(c => `<span class="tag">${c}</span>`).join('');
    const treatments = (data.treatment_interest || []).map(t => `<span class="tag">${t}</span>`).join('');

    card.innerHTML = `
      <span class="type-badge">${data.type_label || data.primary_type || '분석 중'}</span>
      <div class="label">신뢰도</div>
      <div class="confidence-bar"><div class="confidence-fill" style="width:${conf}%"></div></div>
      <div class="label" style="margin-top:8px">주요 걱정</div>
      <div class="tag-list">${concerns || '<span style="color:#a0aec0;font-size:12px">분석 중</span>'}</div>
      <div class="label" style="margin-top:8px">관심 치료</div>
      <div class="tag-list">${treatments || '<span style="color:#a0aec0;font-size:12px">분석 중</span>'}</div>
      <div class="label" style="margin-top:8px">예약 가능성</div>
      <div class="value" style="color:${readinessColor}">${data.appointment_readiness || '-'}</div>
      ${data.strategy_tip ? `<div class="tip-box">💡 ${data.strategy_tip}</div>` : ''}
    `;
  }

  // ── 상담 요약 ─────────────────────────────────────────────────────────────
  async function openSummary() {
    if (messages.length < 2) {
      alert('상담 내용이 부족합니다. 더 많은 대화를 나눠주세요.');
      return;
    }
    document.getElementById('summary-modal').classList.add('open');
    document.getElementById('summary-content').innerHTML = '<p style="color:#a0aec0">요약 생성 중...</p>';

    try {
      const resp = await fetch('/summarize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages }),
      });
      const data = await resp.json();
      renderSummary(data);
    } catch {
      document.getElementById('summary-content').innerHTML = '<p style="color:#e53e3e">요약 생성에 실패했습니다.</p>';
    }
  }

  function renderSummary(d) {
    const readinessClass = {
      '높음': 'readiness-high', '중간': 'readiness-mid', '낮음': 'readiness-low'
    }[d.appointment_readiness] || 'readiness-mid';

    const steps = (d.next_steps || []).map(s => `<li style="margin-bottom:4px">${s}</li>`).join('');
    const treatments = (d.treatments_discussed || []).join(', ') || '-';

    document.getElementById('summary-content').innerHTML = `
      <div class="summary-row">
        <div class="s-label">주요 증상 / 불편</div>
        <div class="s-value">${d.chief_complaint || '-'}</div>
      </div>
      <div class="summary-row">
        <div class="s-label">논의된 치료</div>
        <div class="s-value">${treatments}</div>
      </div>
      <div class="summary-row">
        <div class="s-label">환자 유형</div>
        <div class="s-value">${d.patient_type || '-'}</div>
      </div>
      <div class="summary-row">
        <div class="s-label">예약 가능성</div>
        <div class="s-value">
          <span class="readiness-badge ${readinessClass}">${d.appointment_readiness || '-'}</span>
        </div>
      </div>
      <div class="summary-row">
        <div class="s-label">권장 다음 단계</div>
        <div class="s-value"><ul style="padding-left:18px">${steps || '<li>정보 없음</li>'}</ul></div>
      </div>
      <div class="summary-row">
        <div class="s-label">상담 요약</div>
        <div class="s-value" style="background:#f7fafc;padding:12px;border-radius:8px;border:1px solid #e2e8f0">
          ${d.summary_text || '-'}
        </div>
      </div>
    `;
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
  }

  // 모달 외부 클릭 시 닫기
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', e => {
      if (e.target === overlay) overlay.classList.remove('open');
    });
  });

  // ── 초기화 ────────────────────────────────────────────────────────────────
  function resetChat() {
    if (!confirm('새 상담을 시작하시겠습니까? 현재 상담 내용이 사라집니다.')) return;
    messages = [];
    const el = document.getElementById('messages');
    el.innerHTML = `
      <div class="bubble-wrap assistant">
        <div class="avatar ai">🦷</div>
        <div class="bubble">
          안녕하세요! 저는 치과 상담 AI입니다. 😊<br><br>
          임플란트, 충치, 스케일링, 잇몸 치료 등 궁금하신 점을 편하게 말씀해 주세요.
        </div>
      </div>
    `;
    document.getElementById('patient-card').innerHTML =
      '<div style="color:#a0aec0;font-size:13px;">대화를 시작하면 환자 유형이 분석됩니다.</div>';
  }
</script>
</body>
</html>
